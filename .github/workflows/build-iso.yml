name: build-iso

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["README.md", "docs/**", "CLAUDE.md"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать релиз с этой меткой (например v0.1). Пусто — только сборка."
        required: false
        default: ""

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Debian-контейнер: качает с deb.debian.org, а не с зеркала Ubuntu у GitHub
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Проверка скриптов и конфигов
        shell: bash
        run: |
          apt-get update -qq -o Acquire::Retries=5
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=5 \
            shellcheck yamllint libxml2-utils librsvg2-bin python3
          shellcheck scripts/*.sh
          find build -type f \( -path '*/usr/bin/*' -o -path '*/usr/lib/kroha/*' -o -name '*.hook.chroot' \) \
            -exec shellcheck -s sh {} +
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' .github build/config/includes.chroot/etc/calamares
          . scripts/lib.sh && kroha_load_vars
          tmp=$(mktemp -d); cp -a build/. "$tmp/"; kroha_render_tree "$tmp/config"
          find "$tmp" -name '*.xml' -exec xmllint --noout {} +
          python3 -m json.tool build/config/includes.chroot/usr/lib/firefox-esr/distribution/policies.json >/dev/null
          for s in design/*.svg.tmpl; do kroha_render "$s" "$tmp/x.svg" && rsvg-convert "$tmp/x.svg" -o "$tmp/x.png"; done
          echo "Всё чисто"

  build:
    # не ждёт lint: проверка идёт параллельно, а релиз требует обе
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: debian:trixie
      # live-build нужны mount/chroot; тома — чтобы освободить место на раннере
      options: >-
        --privileged
        -v /usr/share/dotnet:/host/dotnet
        -v /usr/local/lib/android:/host/android
        -v /opt/hostedtoolcache:/host/toolcache
    steps:
      - name: Освободить место на раннере
        run: |
          rm -rf /host/dotnet/* /host/android/* /host/toolcache/* || true
          df -h /
      - uses: actions/checkout@v4
      - name: Инструменты сборки
        run: |
          apt-get update -qq -o Acquire::Retries=5
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=5 \
            live-build librsvg2-bin xorriso squashfs-tools ca-certificates \
            grub-common fonts-dejavu-core fonts-inter
      - name: Кэш пакетов
        uses: actions/cache@v4
        with:
          path: .cache/live-build
          key: lb-${{ hashFiles('build/config/package-lists/*', 'build/auto/config') }}-${{ github.run_id }}
          restore-keys: |
            lb-${{ hashFiles('build/config/package-lists/*', 'build/auto/config') }}-
            lb-
      - name: Сборка ISO
        run: bash scripts/build-iso.sh
      - name: Лог сборки
        if: always()
        run: |
          mkdir -p out
          cp work/build.log out/build.log 2>/dev/null || true
          tail -n 60 work/build.log 2>/dev/null || true
      - name: Контрольные суммы
        run: cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: kroha-iso
          path: |
            out/*.iso
            out/SHA256SUMS
            out/*.packages
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: out/build.log
          retention-days: 7

  test-qemu:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Debian-контейнер (зеркало deb.debian.org); --privileged даёт доступ к /dev/kvm
    container:
      image: debian:trixie
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        mode: [uefi, bios]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: kroha-iso, path: out }
      - name: QEMU
        run: |
          apt-get update -qq -o Acquire::Retries=5
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Acquire::Retries=5 \
            qemu-system-x86 ovmf netpbm python3 procps
          ls -la /dev/kvm || echo "KVM нет — будет медленно"
      - name: Смоук-тест (${{ matrix.mode }})
        shell: bash
        run: TIMEOUT=900 bash scripts/test-qemu.sh out/*.iso ${{ matrix.mode }} out/qemu-${{ matrix.mode }}
      - name: Отчёт
        if: always()
        run: |
          {
            echo "### QEMU ${{ matrix.mode }}"
            echo '```'
            cat out/qemu-${{ matrix.mode }}/summary.txt 2>/dev/null
            grep "KROHA-SMOKE" out/qemu-${{ matrix.mode }}/serial.log 2>/dev/null | head -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-${{ matrix.mode }}
          path: out/qemu-${{ matrix.mode }}/
          retention-days: 14

  release:
    needs: [lint, build, test-qemu]
    # Релиз: метка v* или ветка main, либо ручной запуск с полем «release»
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.release || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'latest' }}
      IS_MAIN: ${{ github.ref == 'refs/heads/main' && inputs.release == '' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: kroha-iso, path: out }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.IS_MAIN == 'true' && 'Kroha OS — свежая сборка' || format('Kroha OS {0}', env.TAG) }}
          prerelease: ${{ env.IS_MAIN == 'true' }}
          make_latest: ${{ env.IS_MAIN != 'true' }}
          body: |
            Образ **Kroha OS** для записи на флешку (≥ 4 ГБ) — файл `.iso` ниже.

            **Как установить:** пошаговая инструкция — в [README](https://github.com/${{ github.repository }}#readme):
            сделать копию файлов → записать ISO через Rufus/Ventoy → F9 при включении → «Установить Kroha OS».

            ✅ Проверено автоматически в виртуальной машине (UEFI и BIOS): система загружается до рабочего стола.
            ⚠️ На реальном HP 15-bw0xx ещё не проверялось — расскажи, что работает, а что нет, в Issues.

            Проверка файла (необязательно): `sha256sum -c SHA256SUMS`.
          files: |
            out/*.iso
            out/SHA256SUMS
