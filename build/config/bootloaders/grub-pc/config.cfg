set default=0
set timeout=5
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
	font=unicode
else
	font=$prefix/unicode.pf2
fi

if loadfont $font ; then
	set gfxmode=1366x768,1920x1080,1280x720,auto
	set gfxpayload=keep
	insmod efi_gop
	insmod efi_uga
	insmod video_bochs
	insmod video_cirrus
	insmod all_video
else
	set gfxmode=auto
	insmod all_video
fi

insmod gfxterm
insmod gfxmenu
insmod png
source /boot/grub/theme.cfg
terminal_output gfxterm
