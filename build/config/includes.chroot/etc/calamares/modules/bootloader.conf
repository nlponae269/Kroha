---
efiBootLoader: "grub"
# В подписанном grubx64.efi Debian зашит каталог EFI/debian — менять нельзя.
# Название в меню прошивки меняет /usr/lib/kroha/calamares-postinstall.
efiBootloaderId: "debian"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
timeout: "2"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# EFI/BOOT/BOOTX64.EFI не трогаем: там может быть загрузчик Windows.
# Если Windows на диске нет, резервную копию кладёт calamares-postinstall.
installEFIFallback: false
