---
userGroup: users
defaultGroups:
    - cdrom
    - sudo
    - audio
    - video
    - plugdev
    - netdev
    - bluetooth
    - users
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: false
allowWeakPasswords: true
allowWeakPasswordsDefault: true
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "kroha-${cpu}"
  forbidden_names: [ localhost ]
